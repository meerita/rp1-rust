[package]
name = "rp1db"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
description = "Official Rust client for RP-1. Early development: this version exposes no public API."
repository = "https://github.com/meerita/rp1-rust"
documentation = "https://docs.rs/rp1db"
readme = "README.md"
keywords = ["rp1", "database", "client", "protocol"]
categories = ["database", "network-programming"]

# An allowlist, not an exclude list. A new path stays out of the package
# until someone adds it here on purpose.
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[lints]
workspace = true

[workspace]
members = ["tools/validation-runner"]
resolver = "3"

[workspace.lints.rust]
warnings = "deny"
unused_results = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"
